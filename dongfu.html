<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洞府 · 角色演武 — 大雷问道 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@400;600;800;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070c10; --ink2:#0a1116; --panel:#0f1a20; --panel2:#12222a;
    --line:rgba(120,170,155,.18); --line2:rgba(120,170,155,.34);
    --jade:#47e0b0; --jade-dp:#1f9d78; --gold:#ecc873; --gold-dp:#b8912f;
    --cyan:#5fd8f2; --flame:#ff6a4d; --rose:#ff9db2;
    --text:#eaf3ef; --muted:#9fb6ad; --dim:#6d867d;
    --atk:#ff6a4d; --vit:#47e0b0; --agi:#5fd8f2;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink);color:var(--text);
    font-family:"Noto Serif SC","Microsoft YaHei","PingFang SC",serif;
    overflow-x:hidden;min-height:100vh}
  body::before{content:"";position:fixed;inset:-20% -10%;z-index:-2;
    background:
      radial-gradient(45% 40% at 18% 18%, rgba(71,224,176,.16), transparent 60%),
      radial-gradient(40% 38% at 84% 14%, rgba(236,200,115,.13), transparent 62%),
      radial-gradient(48% 46% at 74% 86%, rgba(95,216,242,.12), transparent 60%),
      radial-gradient(42% 44% at 22% 84%, rgba(255,106,77,.09), transparent 60%);
    filter:blur(34px);animation:drift 28s ease-in-out infinite alternate}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% -12%, transparent 60%, rgba(0,0,0,.55)),
      linear-gradient(rgba(120,170,155,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,170,155,.03) 1px,transparent 1px);
    background-size:100% 100%, 44px 44px, 44px 44px}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(-3%,2%,0) scale(1.07)}
    100%{transform:translate3d(3%,-2%,0) scale(1.03)}}
  a{color:var(--gold);text-decoration:none}
  .en{font-family:"Cinzel",serif;letter-spacing:.16em}

  /* nav */
  nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:linear-gradient(rgba(7,12,16,.82),rgba(7,12,16,.5));
    border-bottom:1px solid var(--line)}
  nav .wrap{max-width:1240px;margin:0 auto;padding:0 22px;display:flex;
    align-items:center;gap:12px;height:60px}
  .brand{font-family:"Ma Shan Zheng",cursive;font-size:1.7em;line-height:1;
    background:linear-gradient(92deg,var(--gold),#fff6d8 40%,var(--jade));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 24px rgba(71,224,176,.25);white-space:nowrap}
  .brand span{font-family:"Cinzel",serif;font-size:.3em;letter-spacing:.3em;
    color:var(--dim);display:block;margin-top:-6px}
  .proto{margin-left:6px;font-family:"Cinzel",serif;font-size:.62em;letter-spacing:.14em;
    color:var(--ink);background:var(--gold);padding:3px 8px;border-radius:20px;font-weight:800}
  .navlinks{margin-left:auto;display:flex;gap:6px;align-items:center}
  .navlinks a{color:var(--muted);font-size:.92em;padding:7px 12px;border-radius:9px;
    border:1px solid transparent;transition:.2s;font-weight:600}
  .navlinks a:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.03)}

  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  .lede{text-align:center;padding:26px 0 8px}
  .lede h1{font-family:"Ma Shan Zheng",cursive;font-size:2.5em;margin:.1em 0;
    background:linear-gradient(92deg,#fff6d8,var(--jade) 55%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede p{color:var(--muted);margin:.2em 0}

  /* layout */
  .board{display:grid;grid-template-columns:300px 1fr 340px;gap:18px;
    align-items:start;padding:14px 0 40px}
  @media(max-width:1080px){.board{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--ink2));
    border:1px solid var(--line);border-radius:18px;padding:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.03)}
  .card h2{font-size:1.05em;margin:.1em 0 .7em;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px}
  .card h2 .en{font-size:.62em;color:var(--dim);font-weight:600;margin-left:auto}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:12px 0}

  /* info panel */
  .portrait{position:relative;width:100%;aspect-ratio:1/1.12;border-radius:14px;
    overflow:hidden;border:1px solid var(--line2);
    box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
  .portrait img{width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.05)}
  .portrait .frame{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,transparent 55%,rgba(7,12,16,.9));
    box-shadow:inset 0 0 0 1px rgba(236,200,115,.25)}
  .portrait .jing{position:absolute;left:10px;bottom:9px;font-family:"Ma Shan Zheng",cursive;
    font-size:1.5em;color:#fff;text-shadow:0 2px 10px #000}
  .portrait .jing small{display:block;font-family:"Cinzel",serif;font-size:.34em;
    letter-spacing:.24em;color:var(--jade);margin-top:-4px}
  .daohao{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:1.15em;font-weight:800}
  .daohao button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.8em}
  .daohao button:hover{color:var(--gold)}
  .portrait.hurt .frame{box-shadow:inset 0 0 60px rgba(255,70,45,.55),inset 0 0 0 1px rgba(255,90,70,.5)}
  .portrait.hurt{animation:hurtPulse 1.1s ease-in-out infinite}
  @keyframes hurtPulse{50%{filter:brightness(1.06) saturate(1.1)}}
  .portrait.down img{filter:grayscale(.65) brightness(.6) contrast(1.05)}
  .downlabel{display:none;position:absolute;inset:0;z-index:3;
    align-items:center;justify-content:center;flex-direction:column;
    font-family:"Ma Shan Zheng",cursive;font-size:2.4em;color:var(--flame);
    text-shadow:0 2px 16px #000;background:rgba(7,12,16,.32)}
  .downlabel small{font-family:"Cinzel",serif;font-size:.3em;letter-spacing:.3em;color:#ffb3a3;margin-top:2px}
  .portrait.down .downlabel{display:flex}
  .hpwrap{margin-top:12px}
  .hpbar{height:12px;border-radius:7px;background:rgba(255,255,255,.06);
    overflow:hidden;border:1px solid var(--line)}
  .hpbar i{display:block;height:100%;width:100%;border-radius:7px;
    transition:width .35s ease, background .35s}
  .hprow{display:flex;justify-content:space-between;font-size:.82em;color:var(--muted);margin-top:5px}
  #hpNum{font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}

  .res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .res .chip{background:rgba(255,255,255,.03);border:1px solid var(--line);
    border-radius:11px;padding:8px 10px}
  .res .chip .k{font-size:.72em;color:var(--muted);display:flex;align-items:center;gap:5px}
  .res .chip .v{font-size:1.18em;font-weight:800;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .stats{margin-top:2px}
  .stats .row{display:flex;justify-content:space-between;align-items:center;
    padding:6px 2px;border-bottom:1px dashed var(--line);font-size:.95em}
  .stats .row:last-child{border-bottom:none}
  .stats .row .lab{color:var(--muted)}
  .stats .row .val{font-weight:800;font-variant-numeric:tabular-nums}
  .stats .row .val .up{color:var(--jade);font-size:.8em;font-weight:600;margin-left:6px}

  /* equipment */
  .equip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .slot{aspect-ratio:1/1;border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:rgba(255,255,255,.02);position:relative;cursor:pointer;transition:.15s}
  .slot:hover{border-color:var(--line2);transform:translateY(-2px)}
  .slot .ico{font-size:1.5em;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .slot .nm{font-size:.7em;color:var(--muted)}
  .slot.on{border-color:rgba(236,200,115,.5);
    box-shadow:0 0 18px rgba(236,200,115,.18), inset 0 0 22px rgba(236,200,115,.06)}
  .slot.on .nm{color:var(--gold)}
  .slot.lock{opacity:.55}
  .slot.lock .ico{filter:grayscale(1) brightness(.8)}
  .slot .lk{position:absolute;top:5px;right:6px;font-size:.7em;color:var(--dim)}

  /* ---- sword stage ---- */
  .stage{position:relative;min-height:560px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;overflow:hidden}
  .stage-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(rgba(7,12,16,.66),rgba(7,12,16,.9)),
      url(site-img/bg-field.jpg) center/cover;filter:saturate(.85)}
  .stage-bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(62% 52% at 50% 36%, transparent, rgba(7,12,16,.62))}
  .stage > .tier-name,.stage > .tier-sub,.stage > .swordbox,.stage > .swordmeta,
  .stage > .upbtn,.stage > .cap,.stage > .power{position:relative;z-index:1}
  .stage .halo{position:absolute;top:38%;left:50%;width:340px;height:340px;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, var(--auraA,rgba(71,224,176,.22)), transparent 68%);
    filter:blur(6px);transition:.5s;opacity:var(--auraO,.5)}
  .tier-name{font-family:"Ma Shan Zheng",cursive;font-size:2.1em;margin:2px 0 -2px;
    color:var(--bl,#cfd6dd);text-shadow:0 0 26px var(--bl,#cfd6dd);transition:.4s}
  .tier-sub{color:var(--dim);font-family:"Cinzel",serif;letter-spacing:.2em;font-size:.8em;margin-bottom:6px}

  .swordbox{position:relative;width:220px;height:360px;margin:10px auto 4px;
    display:flex;align-items:center;justify-content:center}
  .spin{position:absolute;inset:0;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .qi{position:absolute;top:50%;left:50%;width:12px;height:64px;margin:-32px 0 0 -6px;
    border-radius:6px;background:linear-gradient(var(--ed,#fff),transparent);
    opacity:.0;transition:opacity .5s;filter:drop-shadow(0 0 6px var(--bl,#fff))}

  .sword{position:relative;transform-origin:50% 82%;transition:transform .35s cubic-bezier(.2,1.4,.4,1);
    filter:drop-shadow(0 0 calc(2px + var(--gl,0)*5px) var(--bl,#9aa))
           drop-shadow(0 0 calc(1px + var(--gl,0)*10px) var(--glow2,transparent));
    z-index:2;will-change:transform,filter}
  .blade{width:34px;height:236px;margin:0 auto;position:relative;
    clip-path:polygon(50% 0, 66% 7%, 66% 100%, 34% 100%, 34% 7%);
    background:
      linear-gradient(90deg, color-mix(in srgb,var(--bl,#8b929c) 55%,#000) 0%,
        var(--ed,#eef3f8) 46%, var(--ed,#eef3f8) 54%,
        color-mix(in srgb,var(--bl,#8b929c) 55%,#000) 100%);
    box-shadow:inset 0 0 10px rgba(255,255,255,.35)}
  .blade::after{content:"";position:absolute;left:49%;top:5%;width:2px;height:92%;
    background:linear-gradient(var(--ed,#fff),transparent 85%);opacity:.7;transform:translateX(-50%)}
  .fuller{position:absolute;left:50%;top:16%;width:14px;height:70%;transform:translateX(-50%);
    background:repeating-linear-gradient(0deg,transparent 0 10px, var(--rune,rgba(255,255,255,.0)) 10px 12px);
    opacity:var(--runeO,0);mix-blend-mode:screen;transition:.4s;
    display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
    font-family:"Ma Shan Zheng",cursive;color:var(--ed,#fff);font-size:11px;text-shadow:0 0 6px var(--bl)}
  .guard{width:96px;height:16px;margin:-2px auto 0;border-radius:8px;
    background:linear-gradient(180deg,#e9d8a6,#9a7b31);box-shadow:0 2px 8px rgba(0,0,0,.5);position:relative;z-index:3}
  .guard::before,.guard::after{content:"";position:absolute;top:3px;width:10px;height:10px;border-radius:50%;
    background:var(--bl,#cfd6dd);box-shadow:0 0 8px var(--bl,#fff)}
  .guard::before{left:6px}.guard::after{right:6px}
  .grip{width:16px;height:70px;margin:0 auto;border-radius:6px;
    background:repeating-linear-gradient(45deg,#5a3d22 0 6px,#3c2916 6px 12px)}
  .pommel{width:26px;height:26px;margin:-4px auto 0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f4e6b8,#9a7b31);
    box-shadow:0 0 12px var(--bl,#0000),0 4px 10px rgba(0,0,0,.5)}

  .sword.t-dao .blade{background:linear-gradient(90deg,#ff6a4d,#ecc873,#47e0b0,#5fd8f2,#ff6a4d);
    background-size:100% 400%;animation:daoflow 4s linear infinite}
  @keyframes daoflow{to{background-position:0 400%}}
  .sword.bump{transform:scale(1.14) translateY(-6px)}
  .stage.shake{animation:shake .34s}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
  .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,transparent 55%);
    opacity:0;pointer-events:none;z-index:5}
  .flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  .spark{position:absolute;top:40%;left:50%;width:7px;height:7px;border-radius:50%;
    background:var(--ed,#fff);box-shadow:0 0 10px var(--bl,#fff);pointer-events:none;z-index:6}

  .swordmeta{text-align:center;margin-top:4px}
  .swordlv{font-size:1.05em;color:var(--muted)}
  .swordlv b{color:var(--text);font-size:1.25em}
  .upbtn{margin-top:12px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;
    padding:12px 28px;border-radius:14px;border:1px solid rgba(236,200,115,.5);cursor:pointer;
    background:linear-gradient(180deg,rgba(236,200,115,.22),rgba(236,200,115,.06));
    color:var(--text);font-family:inherit;font-size:1.05em;font-weight:800;transition:.15s}
  .upbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px rgba(236,200,115,.22)}
  .upbtn:disabled{opacity:.45;cursor:not-allowed}
  .upbtn small{font-weight:600;font-size:.7em;color:var(--gold)}
  .cap{color:var(--flame);font-size:.85em;margin-top:8px;max-width:320px;text-align:center}

  /* power bar */
  .power{margin-top:14px;text-align:center;width:100%}
  .power .num{font-family:"Cinzel",serif;font-size:2.6em;font-weight:800;
    background:linear-gradient(92deg,var(--gold),#fff,var(--jade));
    -webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
  .power .lab{color:var(--dim);letter-spacing:.3em;font-family:"Cinzel",serif;font-size:.72em}

  /* allocation */
  .pool{display:flex;align-items:center;justify-content:space-between;
    background:rgba(95,216,242,.06);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;margin-bottom:12px}
  .pool .n{font-size:1.5em;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
  .attr{margin-bottom:12px}
  .attr .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .attr .top .nm{font-weight:800}
  .attr .top .nm .en{font-size:.62em;color:var(--dim);margin-left:6px;font-weight:600}
  .attr .top .lv{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1em}
  .attr .track{display:flex;align-items:center;gap:8px}
  .attr .bar{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
  .attr .bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .3s}
  .pm{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);cursor:pointer;
    background:rgba(255,255,255,.04);color:var(--text);font-size:1.2em;font-weight:800;
    display:flex;align-items:center;justify-content:center;transition:.12s;line-height:1}
  .pm:hover:not(:disabled){background:rgba(255,255,255,.1);transform:translateY(-1px)}
  .pm:disabled{opacity:.3;cursor:not-allowed}
  .attr .grant{font-size:.8em;color:var(--muted);margin-top:5px}
  .attr .grant b{color:var(--text)}
  .miniact{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line2);cursor:pointer;
    background:rgba(255,255,255,.03);color:var(--muted);font-family:inherit;font-weight:700;
    font-size:.86em;transition:.15s}
  .btn:hover{color:var(--text);border-color:var(--jade);background:rgba(71,224,176,.08)}
  .btn.demo{border-color:rgba(236,200,115,.4);color:var(--gold)}

  .toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);
    background:linear-gradient(180deg,var(--panel2),var(--ink2));border:1px solid var(--line2);
    border-radius:14px;padding:12px 22px;font-family:"Ma Shan Zheng",cursive;font-size:1.5em;
    color:var(--gold);box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:.4s;z-index:100;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast small{display:block;font-family:"Cinzel",serif;font-size:.36em;letter-spacing:.2em;
    color:var(--jade);text-align:center;margin-top:2px}

  .foot{text-align:center;color:var(--dim);padding:26px 0 40px;font-size:.86em}
  .foot a{color:var(--muted)}
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="brand">洞府<span>GROTTO · HOME</span></div>
  <span class="proto">PROTOTYPE v0.1</span>
  <div class="navlinks">
    <a href="index.html">← 官网 Site</a>
    <a href="#" id="resetSave" title="清空本地存档">重置存档</a>
  </div>
</div></nav>

<div class="wrap">
  <div class="lede">
    <h1>演武洞天</h1>
    <p>局外养成原型 · 花 <b style="color:var(--gold)">灵石</b> 升级本命剑 · 分配 <b style="color:var(--cyan)">三维</b> · 剑越强越帅</p>
  </div>

  <div class="board">
    <!-- ===== 个人信息面板 ===== -->
    <section class="card">
      <h2>个人信息 <span class="en">PROFILE</span></h2>
      <div class="portrait" id="portrait">
        <img id="portraitImg" src="site-img/hero-norm.png" alt="主角立绘">
        <div class="frame"></div>
        <div class="jing" id="jingLabel">炼气<small>QI CONDENSATION</small></div>
        <div class="downlabel">道消<small>DEFEATED</small></div>
      </div>

      <div class="hpwrap">
        <div class="hpbar"><i id="hpFill"></i></div>
        <div class="hprow"><span>气血 · HP</span><span id="hpNum">—</span></div>
        <div class="miniact">
          <button class="btn" id="hitBtn">模拟受创 · 挨打</button>
          <button class="btn demo" id="healBtn">回气 · 满血</button>
        </div>
      </div>

      <div class="daohao"><span id="daohao">无名剑修</span>
        <button id="renameBtn" title="改道号">✎</button></div>

      <div class="res">
        <div class="chip"><div class="k"><span class="dot" style="background:var(--gold)"></span>灵石</div><div class="v" id="rLingshi">0</div></div>
        <div class="chip"><div class="k"><span class="dot" style="background:var(--jade)"></span>修为</div><div class="v" id="rXiuwei">0</div></div>
      </div>

      <div class="rule"></div>
      <div class="stats" id="statList"></div>
    </section>

    <!-- ===== 本命剑 舞台 ===== -->
    <section class="card stage" id="stage">
      <div class="stage-bg"></div>
      <div class="flash" id="flash"></div>
      <div class="halo" id="halo"></div>
      <div class="tier-name" id="tierName">凡铁剑</div>
      <div class="tier-sub en" id="tierSub">MORTAL IRON</div>

      <div class="swordbox">
        <div class="spin" id="qiRing"></div>
        <div class="sword" id="sword">
          <div class="blade"><div class="fuller" id="fuller"></div></div>
          <div class="guard"></div>
          <div class="grip"></div>
          <div class="pommel"></div>
        </div>
      </div>

      <div class="swordmeta">
        <div class="swordlv">本命剑 · <b id="swordLv">Lv 1</b> <span id="swordAtk" style="color:var(--flame)"></span></div>
      </div>
      <button class="upbtn" id="upBtn">升 · 淬炼本命剑<small id="upCost">耗 灵石 80</small></button>
      <div class="cap" id="capNote" style="display:none"></div>

      <div class="power">
        <div class="num" id="powerNum">0</div>
        <div class="lab">战 力 · POWER</div>
      </div>
    </section>

    <!-- ===== 三维加点 + 装备 ===== -->
    <section class="card">
      <h2>三维加点 <span class="en">ATTRIBUTES</span></h2>
      <div class="pool">剩余点数 · UNSPENT <span class="n" id="poolN">0</span></div>
      <div id="attrs"></div>
      <div class="miniact">
        <button class="btn" id="resetPts">重置洗点</button>
        <button class="btn demo" id="cheatPts">+3 点数（Demo）</button>
      </div>

      <div class="rule"></div>
      <h2>装备栏 <span class="en">LOADOUT</span></h2>
      <div class="equip" id="equip"></div>
      <div class="miniact">
        <button class="btn demo" id="cheatGold">+500 灵石（Demo）</button>
      </div>
    </section>
  </div>

  <div class="foot">
    原型仅演示局外养成手感 · 数值为占位。<a href="index.html">返回官网</a> ·
    <a href="design-plan-meta-v3.md">五资源经济 v3</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- data ---------- */
const JING = [
  {nm:"炼气", en:"QI CONDENSATION", cap:6},
  {nm:"筑基", en:"FOUNDATION", cap:9},
  {nm:"金丹", en:"GOLDEN CORE", cap:12},
  {nm:"元婴", en:"NASCENT SOUL", cap:16},
  {nm:"化神", en:"SPIRIT SEVERING", cap:20},
  {nm:"大乘", en:"GREAT ASCENSION", cap:30},
];
// sword visual tiers by level
const TIERS = [
  {min:1, name:"凡铁剑", en:"MORTAL IRON",  bl:"#8b929c", ed:"#e6ebf1", gl:0, glow2:"transparent",       qi:0, auraO:.15, runeO:0, rune:"rgba(255,255,255,0)"},
  {min:3, name:"精钢剑", en:"TEMPERED STEEL",bl:"#c3ccd6", ed:"#ffffff", gl:1, glow2:"rgba(200,220,240,.5)",qi:0, auraO:.30, runeO:0, rune:"rgba(255,255,255,0)"},
  {min:5, name:"寒灵剑", en:"FROST SPIRIT",  bl:"#47e0b0", ed:"#d6fff2", gl:2, glow2:"rgba(71,224,176,.6)", qi:2, auraO:.5,  runeO:.5, rune:"rgba(214,255,242,.5)"},
  {min:7, name:"流金剑", en:"GILDED FLOW",   bl:"#ecc873", ed:"#fff4cf", gl:3, glow2:"rgba(236,200,115,.6)",qi:4, auraO:.65, runeO:.8, rune:"rgba(255,244,207,.7)"},
  {min:9, name:"仙锋剑", en:"IMMORTAL EDGE", bl:"#5fd8f2", ed:"#eafcff", gl:4, glow2:"rgba(95,216,242,.7)", qi:6, auraO:.8,  runeO:1, rune:"rgba(234,252,255,.85)"},
  {min:12,name:"大道剑", en:"THE GREAT DAO", bl:"#ffffff", ed:"#ffffff", gl:5, glow2:"rgba(255,255,255,.7)",qi:8, auraO:1,   runeO:1, rune:"rgba(255,255,255,.9)", dao:true},
];
const RUNES = ["道","剑","雷","罡","元","无"];
const SWORD_CAP = 15;               // hard demo cap
const swordAtk = lv => Math.round(lv*lv*2 + lv*8);          // attack from sword
const upCost   = lv => Math.round(60 * Math.pow(lv,1.62));  // cost lv -> lv+1

const ATTR = {
  atk:{nm:"攻·炼器", en:"OFFENSE", color:"var(--atk)",
       grant:v=>`攻击力 <b>+${v*6}</b> · 暴击 <b>+${(v*0.6).toFixed(1)}%</b>`},
  vit:{nm:"体·炼体", en:"VITALITY", color:"var(--vit)",
       grant:v=>`最大生命 <b>+${v*40}</b> · 护甲 <b>+${(v*1.2).toFixed(1)}</b>`},
  agi:{nm:"法·身法", en:"AGILITY", color:"var(--agi)",
       grant:v=>`移速 <b>+${v*3}%</b> · 闪避 <b>+${(v*0.7).toFixed(1)}%</b>`},
};

/* ---------- state ---------- */
const DEF = {daohao:"无名剑修", jing:0, lingshi:600, xiuwei:120,
             swordLv:1, alloc:{atk:0,vit:0,agi:0}};
let S = load();
function load(){ try{const s=JSON.parse(localStorage.getItem("dongfu"));
  if(s&&s.alloc) return Object.assign({},DEF,s);}catch(e){} return structuredClone(DEF);}
function save(){ localStorage.setItem("dongfu", JSON.stringify(S)); }

/* points available scale with realm */
const totalPoints = () => 12 + S.jing*6 + (S._bonusPts||0);
const spent = () => S.alloc.atk + S.alloc.vit + S.alloc.agi;
const pool  = () => totalPoints() - spent();
function tierOf(lv){ let t=TIERS[0]; for(const x of TIERS) if(lv>=x.min) t=x; return t; }

/* derived combat stats */
function derived(){
  const a=S.alloc;
  const atk = 12 + a.atk*6 + swordAtk(S.swordLv);
  const crit= 5 + a.atk*0.6;
  const hp  = 120 + a.vit*40;
  const arm = a.vit*1.2;
  const spd = 100 + a.agi*3;
  const dodge = a.agi*0.7;
  const luck  = a.agi*0.5;
  const power = Math.round(atk*4 + hp*0.6 + crit*10 + dodge*7 + spd*1.4 + S.swordLv*40);
  return {atk,crit,hp,arm,spd,dodge,luck,power};
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
let powerShown = 0;
let hpRatio = 1;

function render(prevPower){
  const d = derived(), t = tierOf(S.swordLv), j = JING[S.jing];

  // profile
  $("daohao").textContent = S.daohao;
  $("jingLabel").innerHTML = `${j.nm}<small>${j.en}</small>`;
  $("rLingshi").textContent = S.lingshi.toLocaleString();
  $("rXiuwei").textContent  = S.xiuwei.toLocaleString();

  // HP bar + protagonist portrait state (norm / 大破)
  const maxHP = Math.round(d.hp);
  const curHP = Math.max(0, Math.round(maxHP*hpRatio));
  $("hpNum").textContent = curHP + " / " + maxHP;
  const fill = $("hpFill");
  fill.style.width = (Math.max(0,hpRatio)*100).toFixed(1)+"%";
  fill.style.background = hpRatio>0.5 ? "linear-gradient(90deg,#1f9d78,#47e0b0)"
    : hpRatio>0.30 ? "linear-gradient(90deg,#b8912f,#ecc873)"
    : "linear-gradient(90deg,#a11722,#ff6a4d)";
  const pt = $("portrait"), pim = $("portraitImg");
  pt.classList.toggle("down", hpRatio<=0);
  pt.classList.toggle("hurt", hpRatio>0 && hpRatio<=0.30);
  const nextSrc = "site-img/"+((hpRatio<=0.30) ? "hero-dapo.png" : "hero-norm.png");
  if(!pim.getAttribute("src").endsWith(nextSrc)) pim.setAttribute("src", nextSrc);

  $("statList").innerHTML = [
    ["攻击力", Math.round(d.atk), "flame"],
    ["暴击率", d.crit.toFixed(1)+"%"],
    ["最大生命", Math.round(d.hp)],
    ["护甲", d.arm.toFixed(1)],
    ["移速", Math.round(d.spd)+"%"],
    ["闪避", d.dodge.toFixed(1)+"%"],
    ["幸运", d.luck.toFixed(1)],
    ["剑气·同屏", 1+Math.floor(S.swordLv/3)],
  ].map(r=>`<div class="row"><span class="lab">${r[0]}</span>
     <span class="val" style="${r[2]?'color:var(--'+r[2]+')':''}">${r[1]}</span></div>`).join("");

  // sword stage
  const sw = $("sword");
  $("tierName").textContent = t.name;
  $("tierName").style.setProperty("--bl", t.bl);
  $("tierSub").textContent = t.en;
  $("stage").style.setProperty("--auraA", hexA(t.bl,.28));
  $("halo").style.setProperty("--auraO", t.auraO);
  sw.style.setProperty("--bl", t.bl);
  sw.style.setProperty("--ed", t.ed);
  sw.style.setProperty("--gl", t.gl);
  sw.style.setProperty("--glow2", t.glow2);
  sw.classList.toggle("t-dao", !!t.dao);
  $("fuller").style.setProperty("--runeO", t.runeO);
  $("fuller").style.setProperty("--rune", t.rune);
  $("fuller").innerHTML = t.runeO>0 ? RUNES.slice(0,3+Math.min(3,t.qi/2)).map(r=>`<span>${r}</span>`).join("") : "";
  renderQi(t);
  $("swordLv").textContent = "Lv "+S.swordLv;
  $("swordAtk").textContent = "（攻击 +"+swordAtk(S.swordLv)+"）";

  // upgrade button / cap
  const capped = S.swordLv >= SWORD_CAP;
  const realmCap = S.swordLv >= j.cap;
  const cost = upCost(S.swordLv);
  const btn = $("upBtn");
  if(capped){ btn.disabled=true; btn.firstChild.textContent="已臻至境 · 圆满";
    $("upCost").textContent="剑道圆满"; }
  else if(realmCap){ btn.disabled=true; btn.firstChild.textContent="境界压制 · 需突破";
    $("upCost").textContent="修为不足以承载"; }
  else{ btn.disabled = S.lingshi < cost; btn.firstChild.textContent="升 · 淬炼本命剑";
    $("upCost").textContent = "耗 灵石 "+cost.toLocaleString(); }
  const note=$("capNote");
  if(realmCap && !capped){ note.style.display="block";
    note.innerHTML=`本命剑受 <b>${j.nm}</b> 境界压制（≤Lv ${j.cap}）。<br>更高剑阶需靠 <b>修为</b> 渡劫突破境界 —— 此为设计中的第三条线。`; }
  else note.style.display="none";

  // power count-up
  const target = d.power;
  animatePower(prevPower ?? powerShown, target);

  // attributes
  $("poolN").textContent = pool();
  $("attrs").innerHTML = Object.keys(ATTR).map(k=>{
    const A=ATTR[k], v=S.alloc[k], can = pool()>0, canM = v>0;
    const pct = Math.min(100, v/24*100);
    return `<div class="attr">
      <div class="top"><span class="nm" style="color:${A.color}">${A.nm}<span class="en">${A.en}</span></span>
        <span class="lv" style="color:${A.color}">${v}</span></div>
      <div class="track">
        <button class="pm" data-m="${k}" ${canM?"":"disabled"}>−</button>
        <div class="bar"><i style="width:${pct}%;background:${A.color};box-shadow:0 0 10px ${A.color}"></i></div>
        <button class="pm" data-p="${k}" ${can?"":"disabled"}>＋</button>
      </div>
      <div class="grant">${A.grant(v)}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ if(pool()>0){S.alloc[b.dataset.p]++;save();render();}});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ if(S.alloc[b.dataset.m]>0){S.alloc[b.dataset.m]--;save();render();}});

  renderEquip(t);
}

function renderQi(t){
  const ring=$("qiRing"); ring.innerHTML="";
  for(let i=0;i<t.qi;i++){
    const s=document.createElement("div"); s.className="qi";
    const ang=(360/t.qi)*i;
    s.style.transform=`rotate(${ang}deg) translateY(-118px)`;
    s.style.opacity=.85; s.style.setProperty("--bl",t.bl); s.style.setProperty("--ed",t.ed);
    ring.appendChild(s);
  }
}

function renderEquip(t){
  const items=[
    {ico:"⚔️", nm:t.name, on:true, sub:"Lv "+S.swordLv},
    {ico:"📜", nm:"心法", lock:"筑基"},
    {ico:"🧪", nm:"丹药", lock:"金丹"},
    {ico:"🔱", nm:"分身", lock:"元婴"},
    {ico:"🪷", nm:"护符", lock:"金丹"},
    {ico:"👘", nm:"外观", lock:"天命"},
  ];
  $("equip").innerHTML = items.map(it=>`
    <div class="slot ${it.on?'on':''} ${it.lock?'lock':''}" title="${it.lock?'需 '+it.lock+' 解锁':it.nm}">
      ${it.lock?`<span class="lk">🔒</span>`:''}
      <span class="ico">${it.ico}</span>
      <span class="nm">${it.nm}</span>
      ${it.sub?`<span class="nm" style="color:var(--gold);font-size:.66em">${it.sub}</span>`:''}
    </div>`).join("");
  document.querySelectorAll(".slot.lock").forEach(s=>s.onclick=()=>toast("尚未开启","该装备位需修为 / 天命解锁 · 待开发"));
}

/* ---------- animations / helpers ---------- */
function animatePower(from,to){
  const el=$("powerNum"); const start=performance.now(), dur=520;
  function step(now){ const p=Math.min(1,(now-start)/dur);
    const e=1-Math.pow(1-p,3); const val=Math.round(from+(to-from)*e);
    el.textContent=val.toLocaleString(); if(p<1) requestAnimationFrame(step); else powerShown=to; }
  requestAnimationFrame(step);
}
function hexA(hex,a){ const h=hex.replace('#',''); const n=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`; }
let toastT;
function toast(msg,sub){ const t=$("toast"); t.innerHTML=msg+(sub?`<small>${sub}</small>`:"");
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600); }

function burst(){
  const stage=$("stage"), n=18;
  for(let i=0;i<n;i++){ const s=document.createElement("div"); s.className="spark";
    const t=tierOf(S.swordLv); s.style.setProperty("--bl",t.bl); s.style.setProperty("--ed",t.ed);
    stage.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=90+Math.random()*150;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-40;
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(0)`,opacity:0}],
      {duration:600+Math.random()*400,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove();
  }
}

/* ---------- actions ---------- */
function upgrade(){
  const j=JING[S.jing];
  if(S.swordLv>=SWORD_CAP || S.swordLv>=j.cap) return;
  const cost=upCost(S.swordLv); if(S.lingshi<cost) return;
  const prevTier=tierOf(S.swordLv).name; const prevPower=derived().power;
  S.lingshi-=cost; S.swordLv++; save();
  // juice
  const sw=$("sword"), stage=$("stage"), fl=$("flash");
  sw.classList.add("bump"); stage.classList.add("shake"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
  burst();
  setTimeout(()=>sw.classList.remove("bump"),340);
  setTimeout(()=>stage.classList.remove("shake"),360);
  render(prevPower);
  const nowTier=tierOf(S.swordLv);
  if(nowTier.name!==prevTier) toast("剑成 · "+nowTier.name, nowTier.en);
}

/* ---------- wire ---------- */
$("upBtn").onclick = upgrade;
$("cheatGold").onclick = ()=>{ S.lingshi+=500; save(); render(); toast("灵石 +500","DEMO"); };
$("cheatPts").onclick  = ()=>{ S._bonusPts=(S._bonusPts||0)+3; save(); render(); toast("点数 +3","DEMO"); };
$("hitBtn").onclick = ()=>{
  if(hpRatio<=0) return;
  const before=hpRatio;
  hpRatio = Math.max(0, +(hpRatio-0.34).toFixed(3));
  render();
  if(hpRatio<=0) toast("道消 · 大破","DEFEATED");
  else if(before>0.30 && hpRatio<=0.30) toast("大破 · 濒死","LOW HP");
};
$("healBtn").onclick = ()=>{ hpRatio=1; render(); toast("回气 · 满血","RESTORED"); };
$("resetPts").onclick  = ()=>{ S.alloc={atk:0,vit:0,agi:0}; save(); render(); };
$("renameBtn").onclick = ()=>{ const n=prompt("道号：",S.daohao); if(n){S.daohao=n.slice(0,12);save();render();} };
$("resetSave").onclick = e=>{ e.preventDefault(); if(confirm("清空本地存档并重来？")){localStorage.removeItem("dongfu");S=structuredClone(DEF);render();} };
document.addEventListener("keydown",e=>{ if(e.key.toLowerCase()==="u"){e.preventDefault();upgrade();} });

render();
</script>
</body>
</html>
